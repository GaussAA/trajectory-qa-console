name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (typecheck + lint + test + build + artifact)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v7
        with:
          name: trajectory-qa-console
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v7
        with:
          name: trajectory-qa-cli
          path: dist-cli/qa.mjs
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
